<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐廳管理系統 - 完整版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .order-card { border-left: 5px solid #0d6efd; background: #fff; margin-bottom: 15px; }
        .hidden { display: none !important; }
        .login-container { max-width: 400px; margin: 100px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .menu-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-right: 10px; }
    </style>
</head>
<body class="bg-light">

    <div id="loginSection" class="container">
        <div class="login-container text-center">
            <h3>🔐 員工登入</h3>
            <div class="mb-3 mt-4"><input type="email" id="loginEmail" class="form-control" placeholder="電子信箱"></div>
            <div class="mb-3"><input type="password" id="loginPwd" class="form-control" placeholder="密碼"></div>
            <button id="btnLogin" class="btn btn-primary w-100">登入系統</button>
            <p id="loginError" class="text-danger mt-2"></p>
        </div>
    </div>

    <div id="dashboardSection" class="container hidden p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>👨‍🍳 餐廳管理 <span id="userRoleBadge" class="badge bg-secondary">員工</span></h4>
            <button id="btnLogout" class="btn btn-outline-danger btn-sm">登出</button>
        </div>

        <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-orders">🔔 訂單</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-menu">📝 菜單</button></li>
            <li class="nav-item hidden" id="admin-tab-li"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-users">👥 員工</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="pills-orders">
                <div id="orderList"><p class="text-center text-muted">等待新訂單中...</p></div>
            </div>

            <div class="tab-pane fade" id="pills-menu">
                <div id="menuControlPanel" class="card p-3 mb-3">
                    <div class="input-group mb-2">
                        <input type="text" id="name" class="form-control" placeholder="菜名">
                        <input type="number" id="price" class="form-control" placeholder="價格">
                    </div>
                    <input type="text" id="note" class="form-control mb-2" placeholder="備註提示 (例: 加辣/不加辣)">
                    
                    <div class="mb-2">
                        <label class="form-label small text-muted">餐點圖片網址</label>
                        <input type="text" id="menuImgUrl" class="form-control" placeholder="https://...">
                    </div>

                    <button id="addBtn" class="btn btn-primary w-100">新增菜單</button>
                    <button id="cancelEditBtn" class="btn btn-secondary w-100 mt-2 hidden">❌ 取消修改 (回到新增模式)</button>
                </div>

                <div id="menuControlLock" class="alert alert-warning hidden">⚠️ 只有管理員可以修改菜單</div>
                <ul id="menuList" class="list-group"></ul>
            </div>

            <div class="tab-pane fade" id="pills-users">
                <div class="card p-3">
                    <h5>新增員工帳號</h5>
                    <div class="mb-2">
                        <input type="email" id="newStaffEmail" class="form-control mb-2" placeholder="Email">
                        <input type="password" id="newStaffPwd" class="form-control mb-2" placeholder="密碼">
                    </div>
                    <button id="btnCreateUser" class="btn btn-success w-100">建立帳號</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        // 修正 1: 這裡加上了 deleteApp
        import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 你的設定檔
        const firebaseConfig = {
            apiKey: "AIzaSyBbS-qgY5AvBnRcK3R4CRiOCQTma8DOBUg",
            authDomain: "menu-db-b25a3.firebaseapp.com",
            projectId: "menu-db-b25a3",
            storageBucket: "menu-db-b25a3.firebasestorage.app",
            messagingSenderId: "575823211478",
            appId: "1:575823211478:web:950ced76ff34f586d0d277"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 🔥 確認這裡是老闆 Email (必須跟你在 Firebase Console 用戶列表裡的一模一樣)
        const ADMIN_EMAIL = "admin@ggwp.com"; 
        
        let currentEditId = null;

        // --- 登入狀態監聽 ---
        onAuthStateChanged(auth, (user) => {
            const loginDiv = document.getElementById('loginSection');
            const dashboardDiv = document.getElementById('dashboardSection');
            const menuPanel = document.getElementById('menuControlPanel');
            const menuLock = document.getElementById('menuControlLock');
            const adminTab = document.getElementById('admin-tab-li');

            if (user) {
                loginDiv.classList.add('hidden');
                dashboardDiv.classList.remove('hidden');
                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('userRoleBadge').innerText = "超級管理員";
                    document.getElementById('userRoleBadge').className = "badge bg-danger";
                    menuPanel.classList.remove('hidden');
                    menuLock.classList.add('hidden');
                    adminTab.classList.remove('hidden');
                } else {
                    document.getElementById('userRoleBadge').innerText = "一般員工";
                    menuPanel.classList.add('hidden');
                    menuLock.classList.remove('hidden');
                    adminTab.classList.add('hidden');
                }
                startListeningData(user.email === ADMIN_EMAIL);
            } else {
                loginDiv.classList.remove('hidden');
                dashboardDiv.classList.add('hidden');
            }
        });

        // 按鈕事件
        document.getElementById('btnLogin').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPwd').value)
                .catch(e => document.getElementById('loginError').innerText = "登入失敗：" + e.message);
        });
        document.getElementById('btnLogout').addEventListener('click', () => { signOut(auth); location.reload(); });

        // --- 菜單新增/修改 ---
        document.getElementById('addBtn').addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            const price = Number(document.getElementById('price').value);
            const note = document.getElementById('note').value;
            const imageUrl = document.getElementById('menuImgUrl').value;

            if(!name || !price) { alert("請輸入菜名和價格"); return; }

            try {
                if (currentEditId) {
                    await updateDoc(doc(db, "menu", currentEditId), { name, price, placeholder: note, image: imageUrl });
                    alert("✅ 修改成功！");
                    resetForm();
                } else {
                    await addDoc(collection(db, "menu"), { name, price, placeholder: note, image: imageUrl });
                    alert("✅ 新增成功！");
                    resetForm();
                }
            } catch (e) {
                alert("❌ 操作失敗：" + e.message);
            }
        });

        document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

// --- 資料監聽 ---
        function startListeningData(isAdmin) {
            // A. 訂單監聽 (修正了這裡：加上備註顯示)
            onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snapshot) => {
                const container = document.getElementById('orderList');
                container.innerHTML = snapshot.empty ? '<p class="text-center text-muted">目前沒有訂單</p>' : '';
                
                snapshot.forEach(d => {
                    const order = d.data();
                    let itemsHtml = "";
                    
                    // --- 這裡是被修改的地方 ---
                    for (let k in order.items) {
                        const item = order.items[k];
                        // 判斷如果有備註，就用紅色小字顯示
                        const noteHtml = item.note ? `<span class="text-danger small ms-2">(${item.note})</span>` : '';
                        
                        itemsHtml += `<div>• ${item.name} x <b>${item.qty}</b> ${noteHtml}</div>`;
                    }
                    // -----------------------

                    container.innerHTML += `
                    <div class="card p-3 shadow-sm order-card">
                        <h5>桌號: ${order.table}</h5>
                        <hr>
                        ${itemsHtml}
                        <div class="text-end fw-bold mt-2">總計: $${order.total}</div>
                        <button class="btn btn-success btn-sm mt-2" onclick="window.finishOrder('${d.id}')">完成</button>
                    </div>`;
                });
            });

            // B. 菜單監聽 (維持原本樣子，不用改)
            onSnapshot(collection(db, "menu"), (snapshot) => {
                const list = document.getElementById('menuList');
                list.innerHTML = "";
                snapshot.forEach(docSnapshot => {
                    const data = docSnapshot.data();
                    const id = docSnapshot.id;
                    let imgHtml = data.image ? `<img src="${data.image}" class="menu-thumb">` : '';
                    let actionBtns = '';

                    if (isAdmin) {
                        actionBtns = `<div>
                            <button class="btn btn-sm btn-warning me-1 edit-btn" data-id="${id}" data-name="${data.name}" data-price="${data.price}" data-note="${data.placeholder || ''}" data-img="${data.image || ''}">修改</button>
                            <button class="btn btn-sm btn-danger del-btn" data-id="${id}">刪除</button>
                        </div>`;
                    }
                    
                    const li = document.createElement('li');
                    li.className = "list-group-item d-flex align-items-center justify-content-between";
                    li.innerHTML = `<div class="d-flex align-items-center">${imgHtml}<div><div>${data.name}</div><span class="badge bg-secondary">$${data.price}</span></div></div>${actionBtns}`;
                    list.appendChild(li);
                });

                if (isAdmin) {
                    document.querySelectorAll('.del-btn').forEach(btn => btn.onclick = () => { if(confirm("確定刪除？")) deleteDoc(doc(db, "menu", btn.dataset.id)); });
                    document.querySelectorAll('.edit-btn').forEach(btn => btn.onclick = () => {
                        const d = btn.dataset;
                        document.getElementById('name').value = d.name;
                        document.getElementById('price').value = d.price;
                        document.getElementById('note').value = d.note;
                        document.getElementById('menuImgUrl').value = d.img;
                        currentEditId = d.id;
                        const addBtn = document.getElementById('addBtn');
                        addBtn.innerText = "✅ 確認修改";
                        addBtn.classList.remove('btn-primary');
                        addBtn.classList.add('btn-success');
                        document.getElementById('cancelEditBtn').classList.remove('hidden');
                        document.getElementById('menuControlPanel').scrollIntoView({ behavior: 'smooth' });
                    });
                }
            });
        }
        window.finishOrder = async function(id) { if(confirm("確定完成？")) await deleteDoc(doc(db, "orders", id)); }
    </script>
</body>
</html>
